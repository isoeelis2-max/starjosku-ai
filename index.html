
<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARJOSKU AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#061329;color:#eef4ff;font-family:Arial,sans-serif}
.app{display:flex;min-height:100vh;background:radial-gradient(white .7px,transparent .8px),radial-gradient(#8dbaff .8px,transparent 1px),#061329;background-size:55px 55px,93px 93px,auto;background-position:0 0,25px 30px,0 0}
.sidebar{width:245px;flex-shrink:0;background:rgba(3,13,34,.94);border-right:1px solid #19345c;padding:25px 16px}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:bold;letter-spacing:2px;color:#a9caff;margin-bottom:35px}
.moon{font-size:39px;color:#345b9b;text-shadow:0 0 18px #477acb}
.menu{display:flex;align-items:center;gap:13px;padding:14px 12px;margin:7px 0;border-radius:12px;color:#c5d6f3;cursor:pointer}
.menu:hover{background:#14294a;color:white}
.menu span{font-size:20px}
main{flex:1;min-width:0;padding:30px;display:flex;flex-direction:column;align-items:center}
h1{color:#a9caff;letter-spacing:3px;margin-top:65px}
.subtitle{color:#91a9cb;margin-bottom:35px}
#chat{width:min(760px,100%);height:55vh;min-height:280px;overflow:auto;background:rgba(9,25,52,.85);border:1px solid #25436e;border-radius:18px;padding:18px}
.msg{padding:13px 16px;border-radius:14px;margin:12px 0;line-height:1.5;white-space:pre-wrap}
.bot{background:#142b4d;margin-right:12%}
.user{background:#244b80;margin-left:12%}
form{width:min(760px,100%);display:flex;gap:10px;margin-top:16px}
input{flex:1;min-width:0;background:#102341;color:white;border:1px solid #355781;border-radius:12px;padding:15px;font-size:16px}
button{background:#315c99;color:white;border:1px solid #628bc5;border-radius:12px;padding:14px 20px;font-weight:bold;cursor:pointer}
small{color:#829bbd;margin-top:20px}
@media(max-width:600px){.sidebar{width:155px;padding:15px 8px}.brand{font-size:15px}.menu{font-size:13px;gap:7px}main{padding:15px}h1{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><span class="moon">☾</span> STARJOSKU</div>
<div class="menu" onclick="newChat()"><span>＋</span> Uusi keskustelu</div>
<div class="menu" onclick="showSection('Kuvat')"><span>▧</span> Kuvat</div>
<div class="menu" onclick="showSection('Kirjasto')"><span>▤</span> Kirjasto</div>
<div class="menu" onclick="showSection('Historia')"><span>◷</span> Historia</div>
</aside>
<main>
<h1>STARJOSKU AI</h1>
<div class="subtitle">Tähtitaivaan alla syntyvät ideat ✨</div>
<div id="chat">
<div class="msg bot">Hei! Olen STARJOSKU AI. 🌙 Mitä tehdään tänään?</div>
</div>
<form id="form">
<input id="message" placeholder="Kirjoita viesti..." autocomplete="off" required>
<button>Lähetä</button>
</form>
<small>STARJOSKU AI · Oma tekoälysi</small>
</main>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('message');
function add(text,who){
const div=document.createElement('div');
div.className='msg '+who;
div.textContent=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}
function newChat(){
chat.innerHTML='';
add('Uusi keskustelu! 🌙 Mitä haluaisit tehdä?','bot');
}
function showSection(name){
add(name+'-osio lisätään seuraavaksi.','bot');
}
document.getElementById('form').addEventListener('submit',e=>{
e.preventDefault();
const text=input.value.trim();
if(!text)return;
add(text,'user');
input.value='';
add('Tekoälyä ei ole vielä yhdistetty. Se tehdään myöhemmin!','bot');
});
</script>
</body>
</html>
